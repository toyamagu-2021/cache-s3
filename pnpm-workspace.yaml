# Both packages ship optional native binaries; the prebuilt artifacts they fall
# back to are enough for linting, so their install scripts stay unexecuted.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

# Patch high and critical advisories in place. The parent packages are already
# on their current releases and still depend on the vulnerable versions.
overrides:
  'brace-expansion@1': 1.1.22
  'brace-expansion@2': 2.1.8
  'brace-expansion@5': 5.0.13
  'browserslist@<=4.28.6': 4.28.7
  'fast-xml-parser@>=5.9.3 <5.10.1': 5.10.1
  'handlebars@4.7.9': 4.7.10
  'js-yaml@3': 3.15.2
  'js-yaml@4': 4.3.2
  'undici@6': 6.29.1
